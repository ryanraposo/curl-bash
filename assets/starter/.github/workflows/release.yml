name: Installer Release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - run: ./tests/run.sh
      - run: SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" ./scripts/package-release.sh
      - uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/__PROJECT__-*.tar.gz
      - env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/__PROJECT__-*.tar.gz dist/SHA256SUMS
          gh release edit "$GITHUB_REF_NAME" --draft=false
